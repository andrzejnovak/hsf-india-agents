# The sealed run of the hackathon, on a throwaway machine: every comment on the submissions issue (issue 1)
# re-scores every submission on a fresh sealed suite and commits the leaderboard table into hackathon/README.md.
# Run it by hand ("Run workflow") with plots: true after the deadline for the final table with recovery plots.
name: sealed run

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      n:
        description: "datasets in the sealed suite (public seed_000 included)"
        default: "21"
      plots:
        description: "publish the recovery plots too (after the deadline only, they show the planted values)"
        type: boolean
        default: false
      seed:
        description: "a fixed master seed (empty: made up for this run and never printed)"
        default: ""

concurrency:
  group: sealed-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  score:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet numpy scipy matplotlib
      - name: score every submission on a sealed suite
        working-directory: hackathon
        run: |
          python sealed_run.py --out /tmp/sealed --as nobody --publish README.md \
            --n "${{ github.event.inputs.n || '21' }}" \
            ${{ github.event.inputs.plots == 'true' && '--plots' || '' }} \
            ${{ github.event.inputs.seed != '' && format('--seed {0}', github.event.inputs.seed) || '' }}
      - name: commit the leaderboard
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "sealed run"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p hackathon/results && git add hackathon/README.md hackathon/results
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -q -m "Hackathon leaderboard: sealed run of $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main && exit 0
            sleep 5
          done
          exit 1
